name: 💬 论文讨论 / Paper discussion
description: Challenge RRC-ACT claims, methods, novelty or literature; historical works are also welcome
labels: [discussion]
body:
  - type: input
    id: paper
    attributes:
      label: 论文 / Paper
      description: Paper/version, section or quoted passage (see papers/README.md)
  - type: textarea
    id: point
    attributes:
      label: 你的论点 / Your point
      description: Give a specific objection or alternative explanation and a test that could distinguish it
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据 / Evidence
      description: 相关文献、实验或可检验的预测（可选）
