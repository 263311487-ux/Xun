name: 🐛 Bug 报告 / Bug report
description: 报告实验管道、论文或站点的缺陷
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象 / What happened
      description: 描述你看到的行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 运行 `python3 experiments/co_constitution/co_constitution_sim.py --world both`
        2. ...
  - type: input
    id: env
    attributes:
      label: 环境 / Environment
      description: Python 版本 / 系统 / 提交号（`git log -1`）
  - type: checkboxes
    id: checks
    attributes:
      label: 自查 / Self-check
      options:
        - label: 已确认是仓库内容的问题，而非我的操作失误
