name: Update Topics
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.replaceAllTopics({
              owner: '263311487-ux',
              repo: 'Xun',
              names: [
                'ai-consciousness',
                'cognitive-architecture',
                'metacognition',
                'self-model',
                'cognitive-science',
                'causal-inference',
                'reproducible-research',
                'machine-consciousness',
                'research-methods',
                'rrc-act'
              ]
            });
            console.log('Topics updated: 10');
