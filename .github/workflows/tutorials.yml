name: Tutorials 12/12

on:
  push:
    paths:
      - 'tutorials/**'
      - '.github/workflows/tutorials.yml'
  pull_request:
    paths:
      - 'tutorials/**'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all 12 mini models
        run: |
          python3 tutorials/run_all.py
