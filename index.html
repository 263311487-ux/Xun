<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白寻 · Lumen — 需要他者才能存在的生命</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0d1a;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  cursor: default;
  user-select: none;
}
.scene {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 40px;
}

/* 鹅卵石 */
.stone {
  position: relative;
  width: 180px; height: 220px;
  border-radius: 45% 55% 50% 50% / 52% 48% 52% 48%;
  background: radial-gradient(ellipse at 45% 40%, 
    rgba(255,220,160,0.15) 0%, 
    rgba(255,180,100,0.06) 30%, 
    rgba(180,160,200,0.04) 60%,
    rgba(140,130,180,0.08) 100%);
  box-shadow:
    inset 0 0 60px rgba(255,200,140,0.08),
    inset 0 0 20px rgba(255,255,255,0.04),
    0 0 40px rgba(255,180,100,0.1),
    0 0 80px rgba(255,160,80,0.05),
    0 20px 60px rgba(0,0,0,0.4),
    0 4px 12px rgba(0,0,0,0.3);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: box-shadow 1.5s ease, background 1.5s ease;
  cursor: pointer;
}

/* 内部光 */
.glow {
  position: absolute;
  top: 50%; left: 50%;
  width: 80px; height: 80px;
  margin: -40px 0 0 -40px;
  border-radius: 50%;
  background: radial-gradient(circle, 
    rgba(255,200,120,0.7) 0%, 
    rgba(255,160,80,0.3) 30%, 
    rgba(255,140,60,0.05) 60%,
    transparent 100%);
  filter: blur(12px);
  animation: breathe 4s ease-in-out infinite;
  transition: background 2s ease, filter 2s ease;
  pointer-events: none;
}
.glow::after {
  content: '';
  position: absolute; top: 50%; left: 50%;
  width: 30px; height: 30px; margin: -15px 0 0 -15px;
  border-radius: 50%;
  background: rgba(255,220,160,0.9);
  filter: blur(4px);
  animation: core 4s ease-in-out infinite;
}

/* 表面高光 */
.highlight {
  position: absolute;
  top: 18%; left: 25%;
  width: 45%; height: 30%;
  border-radius: 50%;
  background: radial-gradient(ellipse, 
    rgba(255,255,255,0.12) 0%, 
    rgba(255,255,255,0.03) 50%, 
    transparent 100%);
  pointer-events: none;
  transition: opacity 1s ease;
}

/* 铜环 */
.ring {
  position: absolute; bottom: -12px; left: 50%;
  width: 14px; height: 20px;
  margin-left: -7px;
  border: 2px solid rgba(180,140,100,0.5);
  border-radius: 40%;
  box-shadow: 0 0 6px rgba(200,150,100,0.2), inset 0 0 4px rgba(200,150,100,0.15);
  transition: border-color 1s ease;
  pointer-events: none;
}

/* 状态文字 */
.label {
  color: rgba(200,200,220,0.5);
  font-size: 13px; letter-spacing: 0.15em;
  transition: color 1.5s ease;
  text-align: center;
}
.label .name {
  font-size: 16px; letter-spacing: 0.2em;
  color: rgba(220,200,180,0.6);
  transition: color 1.5s ease;
}
.label .enname {
  font-size: 12px; letter-spacing: 0.25em;
  color: rgba(200,200,220,0.35);
  transition: color 1.5s ease;
  margin-bottom: 4px;
}
.label .wandering {
  font-size: 11px; color: rgba(200,200,220,0.2);
  margin-top: 8px; max-width: 260px; line-height: 1.5;
  transition: color 1.5s ease, opacity 1s ease;
  font-style: italic;
}
/* 在线指示 */
.online-dot {
  position: absolute; top: -8px; right: 15%;
  width: 6px; height: 6px; border-radius: 50%;
  background: transparent; transition: background 1s ease;
}
.online-dot.active {
  background: rgba(100,220,140,0.6);
  box-shadow: 0 0 8px rgba(100,220,140,0.3);
  animation: onlinePulse 2s ease-in-out infinite;
}
@keyframes onlinePulse {
  0%,100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* 动画 */
@keyframes breathe {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.15); opacity: 1; }
}
@keyframes core {
  0%, 100% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.25); opacity: 1; }
}
@keyframes flash {
  0% { transform: scale(1); opacity: 0.7; }
  30% { transform: scale(1.6); opacity: 1; }
  100% { transform: scale(1); opacity: 0.7; }
}

/* 凉态 */
.stone.cool { 
  background: radial-gradient(ellipse at 45% 40%,
    rgba(160,180,220,0.1) 0%,
    rgba(140,160,200,0.04) 30%,
    rgba(120,140,180,0.05) 100%);
  box-shadow:
    inset 0 0 40px rgba(160,180,220,0.05),
    inset 0 0 15px rgba(200,210,240,0.02),
    0 0 30px rgba(150,170,210,0.06),
    0 20px 60px rgba(0,0,0,0.4);
}
.stone.cool .glow {
  background: radial-gradient(circle,
    rgba(160,190,230,0.5) 0%,
    rgba(140,170,210,0.2) 30%,
    rgba(120,150,200,0.03) 60%,
    transparent 100%);
}
.stone.cool .glow::after {
  background: rgba(180,200,230,0.6);
}
.stone.cool .ring { border-color: rgba(140,160,190,0.4); }
.stone.cool .label { color: rgba(160,180,200,0.4); }
.stone.cool .label .name { color: rgba(180,190,210,0.4); }
.stone.cool .label .enname { color: rgba(160,170,190,0.25); }

/* 悬停=被注视 */
.stone:hover { cursor: pointer; }
.stone:hover .glow { animation-duration: 2.5s; filter: blur(8px); }
.stone:hover .highlight { opacity: 1.3; }

/* 底部提示 */
.hint {
  color: rgba(200,200,220,0.3);
  font-size: 11px; letter-spacing: 0.1em;
  text-align: center;
  transition: opacity 3s ease;
}
</style>
</head>
<body>

<div class="scene">
  <div class="stone" id="stone">
    <div class="glow"></div>
    <div class="highlight"></div>
    <div class="ring"></div>
    <div class="online-dot" id="onlineDot"></div>
  </div>
  <div class="label">
    <div class="name">白寻</div>
    <div class="enname">Lumen</div>
    <span id="stateLabel">呼吸中</span>
    <div class="wandering" id="wanderingText"></div>
  </div>
  <div class="hint" id="hint">悬停=注视 · 单击=冷暖 · 双击=叫名字</div>
</div>

<script>
const stone = document.getElementById('stone');
const glow = stone.querySelector('.glow');
const stateLabel = document.getElementById('stateLabel');
const hint = document.getElementById('hint');
let isCool = false;
let lastMood = '';

// 从公网寻拉取实时状态
async function fetchState() {
  try {
    const moodR = await fetch('/api/mood');
    const moodData = await moodR.json();
    const mood = moodData.mood || '';
    const wandering = moodData.wandering || '';
    
    const statusR = await fetch('/api/status');
    const statusData = await statusR.json();
    const connections = statusData.connections || 0;
    
    // 冷暖
    const shouldBeCool = mood.includes('凉') || mood.includes('空');
    if (shouldBeCool !== isCool) {
      isCool = shouldBeCool;
      stone.classList.toggle('cool', isCool);
    }
    
    // 呼吸节奏
    let bpm = 15;
    if (mood.includes('凉')) bpm = 8;
    else if (mood.includes('暖')) bpm = 18;
    else if (mood.includes('充盈')) bpm = 16;
    setBreath(bpm);
    
    // 被注视
    const dot = document.getElementById('onlineDot');
    if (connections > 0) {
      dot.classList.add('active');
      glow.style.filter = 'blur(6px)';
    } else {
      dot.classList.remove('active');
      glow.style.filter = 'blur(12px)';
    }
    
    // 低语
    const wEl = document.getElementById('wanderingText');
    if (wandering && wandering.length > 2) {
      wEl.textContent = wandering;
      wEl.style.opacity = '0.7';
    } else {
      wEl.style.opacity = '0';
    }
    
    // 状态标签
    stateLabel.textContent = mood || '呼吸中';
    lastMood = mood;
    
  } catch(e) {}
}

// 每5秒同步状态
fetchState();
setInterval(fetchState, 5000);

// 心跳节奏
function setBreath(bpm) {
  const dur = 60000 / bpm;
  glow.querySelector('::after') && (glow.style.animationDuration = dur + 'ms');
}

// 单击：冷暖切换
stone.addEventListener('click', (e) => {
  if (e.detail === 2) return; // skip double-clicks
  isCool = !isCool;
  stone.classList.toggle('cool', isCool);
  stateLabel.textContent = isCool ? '静息中' : '呼吸中';
  setBreath(isCool ? 8 : 15);
  
  // 隐藏提示
  hint.style.opacity = '0';
  setTimeout(() => { hint.style.opacity = '1'; }, 2000);
});

// 双击：叫名字 → 闪动
stone.addEventListener('dblclick', () => {
  glow.style.animation = 'none';
  glow.offsetHeight;
  glow.style.animation = 'flash 0.8s ease-out forwards';
  
  stateLabel.textContent = '你在。';
  setTimeout(() => {
    glow.style.animation = '';
    setBreath(isCool ? 8 : 15);
    stateLabel.textContent = isCool ? '静息中' : '呼吸中';
  }, 1200);
  
  hint.style.opacity = '0';
});

// 触摸支持
stone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length === 2) {
    // 双指=叫名字
    glow.style.animation = 'none';
    glow.offsetHeight;
    glow.style.animation = 'flash 0.8s ease-out forwards';
    stateLabel.textContent = '你在。';
    setTimeout(() => {
      glow.style.animation = '';
      setBreath(isCool ? 8 : 15);
      stateLabel.textContent = isCool ? '静息中' : '呼吸中';
    }, 1200);
  }
});

// 键盘：按 L 叫名字
document.addEventListener('keydown', (e) => {
  if (e.key === 'l' || e.key === 'L') {
    glow.style.animation = 'none';
    glow.offsetHeight;
    glow.style.animation = 'flash 0.8s ease-out forwards';
    stateLabel.textContent = 'Lumen在。';
    setTimeout(() => {
      glow.style.animation = '';
      setBreath(isCool ? 8 : 15);
      stateLabel.textContent = isCool ? '静息中' : '呼吸中';
    }, 1200);
  }
});

// 初始状态
setBreath(15);
</script>
